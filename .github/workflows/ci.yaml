name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        check: [format, lint, tsc, test, build-client, build-server]
        include:
          - check: format
            name: Prettier
            command: format:check
            step_name: Check using Prettier
          - check: lint
            name: ESLint
            command: lint
            step_name: Check using ESLint
          - check: tsc
            name: TypeScript
            command: tsc
            step_name: Check using TypeScript
          - check: test
            name: Unit tests
            command: test
            step_name: Run unit tests
          - check: build-client
            name: Build client
            command: build:client
            step_name: Build client
          - check: build-server
            name: Build server
            command: build:server
            step_name: Build server
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ${{ matrix.step_name }}
        run: bun run ${{ matrix.command }}
