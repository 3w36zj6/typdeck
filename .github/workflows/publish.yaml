name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binary:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            executable: typdeck
            archive: typdeck-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz
          - runner: macos-15
            platform: darwin-aarch64
            executable: typdeck
            archive: typdeck-${{ github.event.release.tag_name }}-darwin-aarch64.tar.gz
          - runner: windows-2025
            platform: windows-x86_64
            executable: typdeck.exe
            archive: typdeck-${{ github.event.release.tag_name }}-windows-x86_64.zip
    runs-on: ${{ matrix.runner }}
    env:
      EXECUTABLE: ${{ matrix.executable }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: aube ci
      - name: Build CLI
        shell: bash
        run: |
          aube run build
          mkdir release
          bun build --compile bin/index.js --outfile "release/$EXECUTABLE"
          cp LICENSE release/LICENSE
      - name: Create archive
        if: runner.os != 'Windows'
        run: tar -czf "release/$ARCHIVE" -C release "$EXECUTABLE" LICENSE
      - name: Create archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/$env:EXECUTABLE", "release/LICENSE" -DestinationPath "release/$env:ARCHIVE"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  upload:
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber

  npm:
    needs: upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: aube ci
      - name: Publish package
        run: aube publish --provenance
